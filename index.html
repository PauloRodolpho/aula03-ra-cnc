<!DOCTYPE html> <!-- Informa ao navegador que este arquivo usa o padrão HTML5. -->
<html lang="pt-BR"> <!-- Define o idioma principal da página como português do Brasil. -->
<head> <!-- Inicia a área de configurações e dependências da página. -->
  <meta charset="UTF-8"> <!-- Permite acentos e caracteres especiais corretamente. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> <!-- Faz a página ocupar corretamente a tela do celular. -->
  <title>Aula 03 - Torno CNC | RA Interativa</title> <!-- Define o título exibido na aba do navegador. -->
  <link rel="stylesheet" href="css/style.css"> <!-- Carrega o arquivo de estilos visuais da aplicação. -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script> <!-- Carrega o A-Frame, responsável pela cena 3D. -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script> <!-- Carrega o MindAR para reconhecer e rastrear a imagem impressa. -->
</head> <!-- Encerra a área de configurações. -->
<body> <!-- Inicia o conteúdo da aplicação. -->

  <header id="hud"> <!-- Cria o painel superior que mostra o estado da experiência. -->
    <div class="hud-copy"> <!-- Agrupa título e instrução. -->
      <strong>TORNO CNC • MANUAL RA</strong> <!-- Exibe o nome da experiência. -->
      <span id="status">Carregando câmera e target...</span> <!-- Texto alterado pelo JavaScript conforme o estado. -->
    </div> <!-- Encerra o agrupamento textual. -->
    <span id="badge">INICIANDO</span> <!-- Selo visual de estado. -->
  </header> <!-- Encerra o HUD. -->

  <section id="panel" class="panel hidden" aria-live="polite"> <!-- Cria o painel HTML que mostrará informações depois do toque. -->
    <button id="close-panel" class="close" aria-label="Fechar painel">×</button> <!-- Permite fechar o painel no celular. -->
    <p id="panel-kicker">COMPONENTE DO TORNO</p> <!-- Pequeno rótulo do painel. -->
    <h2 id="panel-title">Componente</h2> <!-- Recebe dinamicamente o título do hotspot tocado. -->
    <p id="panel-text">Informações do componente.</p> <!-- Recebe dinamicamente a explicação principal. -->
    <div id="panel-detail"></div> <!-- Recebe dinamicamente uma observação complementar. -->
  </section> <!-- Encerra o painel informativo. -->

  <aside id="help"> <!-- Exibe uma instrução curta na parte inferior. -->
    <span>Enquadre a folha impressa inteira. Quando os círculos aparecerem, toque diretamente neles.</span> <!-- Orienta o usuário. -->
  </aside> <!-- Encerra a instrução inferior. -->

  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: assets/targets/torno-cnc.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable"
    embedded> <!-- Cria a cena de RA, inicia a câmera e limita o raycaster aos objetos clicáveis. -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="rayOrigin: mouse"
      raycaster="objects: .clickable"> <!-- Usa toque/mouse para lançar um raio sobre os hotspots 3D. -->
    </a-camera> <!-- Encerra a câmera virtual. -->

    <a-entity id="target" mindar-image-target="targetIndex: 0"> <!-- Tudo dentro deste grupo fica ancorado ao primeiro target do arquivo .mind. -->

      <a-entity id="hotspot-cabecote" class="clickable hotspot3d" data-topic="cabecote" position="-0.36 0.03 0.03"> <!-- Hotspot 1: fica preso à região esquerda do target. -->
        <a-circle radius="0.075" color="#0b5fa5" opacity="0.96" material="shader: flat" animation="property: scale; dir: alternate; dur: 750; loop: true; to: 1.12 1.12 1.12"></a-circle> <!-- Desenha o círculo azul pulsante. -->
        <a-ring radius-inner="0.083" radius-outer="0.098" color="#ffffff" material="shader: flat"></a-ring> <!-- Desenha o contorno branco. -->
        <a-text value="1" align="center" color="#ffffff" width="0.75" position="0 0 0.006"></a-text> <!-- Mostra o número 1. -->
      </a-entity> <!-- Encerra o hotspot 1. -->

      <a-entity id="hotspot-torre" class="clickable hotspot3d" data-topic="torre" position="0.12 0.03 0.03"> <!-- Hotspot 2: fica preso à região central do target. -->
        <a-circle radius="0.075" color="#0b5fa5" opacity="0.96" material="shader: flat" animation="property: scale; dir: alternate; dur: 850; loop: true; to: 1.12 1.12 1.12"></a-circle> <!-- Desenha o círculo azul pulsante. -->
        <a-ring radius-inner="0.083" radius-outer="0.098" color="#ffffff" material="shader: flat"></a-ring> <!-- Desenha o contorno branco. -->
        <a-text value="2" align="center" color="#ffffff" width="0.75" position="0 0 0.006"></a-text> <!-- Mostra o número 2. -->
      </a-entity> <!-- Encerra o hotspot 2. -->

      <a-entity id="hotspot-comando" class="clickable hotspot3d" data-topic="comando" position="0.37 0.16 0.03"> <!-- Hotspot 3: fica preso à região do comando CNC. -->
        <a-circle radius="0.075" color="#0b5fa5" opacity="0.96" material="shader: flat" animation="property: scale; dir: alternate; dur: 950; loop: true; to: 1.12 1.12 1.12"></a-circle> <!-- Desenha o círculo azul pulsante. -->
        <a-ring radius-inner="0.083" radius-outer="0.098" color="#ffffff" material="shader: flat"></a-ring> <!-- Desenha o contorno branco. -->
        <a-text value="3" align="center" color="#ffffff" width="0.75" position="0 0 0.006"></a-text> <!-- Mostra o número 3. -->
      </a-entity> <!-- Encerra o hotspot 3. -->

      <a-entity id="hotspot-seguranca" class="clickable hotspot3d" data-topic="seguranca" position="0.36 -0.16 0.03"> <!-- Hotspot 4: fica preso à região inferior direita. -->
        <a-circle radius="0.075" color="#dc2626" opacity="0.96" material="shader: flat" animation="property: scale; dir: alternate; dur: 1050; loop: true; to: 1.12 1.12 1.12"></a-circle> <!-- Desenha o círculo vermelho pulsante. -->
        <a-ring radius-inner="0.083" radius-outer="0.098" color="#ffffff" material="shader: flat"></a-ring> <!-- Desenha o contorno branco. -->
        <a-text value="4" align="center" color="#ffffff" width="0.75" position="0 0 0.006"></a-text> <!-- Mostra o número 4. -->
      </a-entity> <!-- Encerra o hotspot 4. -->

    </a-entity> <!-- Encerra o grupo que acompanha o target. -->
  </a-scene> <!-- Encerra a cena de RA. -->

  <script src="js/app.js"></script> <!-- Carrega a lógica depois que todos os elementos da página já existem. -->
</body> <!-- Encerra o conteúdo da página. -->
</html> <!-- Encerra o documento HTML. -->
