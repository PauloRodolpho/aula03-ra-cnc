<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>RA | Manual Interativo do Torno CNC</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
<header id="hud">
  <div><strong>TORNO CNC • MANUAL INTERATIVO</strong><span id="status">Inicializando a câmera...</span></div>
  <span id="badge">INICIANDO</span>
</header>

<!-- Hotspots HTML: o toque não depende do raycaster do A-Frame. -->
<div id="hotspot-layer">
  <button class="hotspot" data-topic="placa" data-x="-0.34" data-y="0.02" data-z="0.03">1</button>
  <button class="hotspot" data-topic="torre" data-x="0.07" data-y="0.03" data-z="0.03">2</button>
  <button class="hotspot" data-topic="comando" data-x="0.36" data-y="0.15" data-z="0.03">3</button>
  <button class="hotspot danger" data-topic="seguranca" data-x="0.35" data-y="-0.16" data-z="0.03">4</button>
</div>

<section id="info-panel" class="info-panel hidden">
  <button id="close-panel" class="close-button">×</button>
  <small>PONTO DO TORNO</small>
  <h2 id="info-title">Componente</h2>
  <p id="info-text">Descrição.</p>
  <p id="info-detail" class="detail">Detalhe.</p>
</section>

<!-- Estrutura próxima ao exemplo oficial do MindAR; sem fundo preto forçado. -->
<a-scene id="ar-scene"
  mindar-image="imageTargetSrc: assets/targets/torno-cnc.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded>
  <a-camera id="ar-camera" position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>

<script src="js/app.js"></script>
</body>
</html>
